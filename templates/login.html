<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap" />
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Roboto Mono"', 'monospace'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Roboto Mono", monospace;
    }
  </style>
</head>
<body class="min-h-dvh bg-white text-black font-mono overflow-x-hidden">
  <main class="min-h-dvh flex items-center justify-center px-4 py-8 sm:py-12">
    <div class="w-full max-w-lg border-2 border-black bg-white shadow-[10px_10px_0_0_#000]">
      <div class="p-6 sm:p-8 sm:p-10">
        <div class="mb-8">
          <p class="text-sm uppercase tracking-[0.35em] text-gray-600">Private Area</p>
          <h1 class="mt-3 text-3xl sm:text-4xl lg:text-5xl font-bold">Sign in</h1>
          <!-- <p class="mt-3 text-sm sm:text-base text-gray-700 leading-relaxed">
            Use your personal username and password to enter the private section.
          </p> -->
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-6 space-y-3">
              {% for category, message in messages %}
                <div class="border-2 border-black px-4 py-3 text-sm {% if category == 'error' %}bg-red-50{% else %}bg-gray-50{% endif %}">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="post" class="space-y-5">
          <div>
            <label for="username" class="block text-sm font-medium mb-2">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              class="w-full border-2 border-black px-4 py-3 text-sm sm:text-base outline-none focus:bg-black focus:text-white transition-colors"
              placeholder="Enter your username"
            />
          </div>

          <div>
            <label for="password" class="block text-sm font-medium mb-2">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="w-full border-2 border-black px-4 py-3 text-sm sm:text-base outline-none focus:bg-black focus:text-white transition-colors"
              placeholder="Enter your password"
            />
          </div>

          <button
            type="submit"
            class="w-full border-2 border-black bg-black px-4 py-3 text-sm sm:text-base text-white font-semibold hover:bg-white hover:text-black transition-colors"
          >
            Log In
          </button>
        </form>

        <div class="mt-8 text-sm text-gray-600 space-y-1">
          <!-- <p>Accounts are stored in <code>portfolio.db</code>.</p> -->
          <p>After login, you will be sent to the private dashboard.</p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
